# OPTIONAL: rebuilds a GitHub stats card (assets/github-metrics.svg) every day.
# You only need this if you turn on the optional metrics block in README.md.
#
# SETUP (one time, ~3 minutes):
#   1. GitHub -> Settings -> Developer settings -> Personal access tokens
#      -> Tokens (classic) -> Generate new token (classic).
#      Tick: read:user, public_repo. Copy the token.
#   2. In THIS repo: Settings -> Secrets and variables -> Actions
#      -> New repository secret -> name: METRICS_TOKEN, value: the token.
#   3. Repo -> Actions tab -> "Update GitHub Metrics" -> Run workflow (first run).
#   4. In README.md, turn on the optional metrics block.
#
# To remove this feature, just delete this file.

name: Update GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC (06:00 in Dhaka). Change if you like.
  workflow_dispatch:       # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/update-metrics.yml"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: smdanial
          filename: assets/github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Dhaka
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
